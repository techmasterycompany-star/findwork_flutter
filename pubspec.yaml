name: findwork_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc:
  flutter_svg: ^2.3.0
  flutter_localizations:
    sdk: flutter
  google_fonts: ^8.2.1
  font_awesome_flutter:
  number_pagination:
  fl_chart: ^1.2.0
  flutter_screenutil: ^5.9.3
  image_picker: ^1.2.3
  go_router: ^17.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Candidates
    - asset/images/logo.png
    - asset/icons/translate.svg
    - asset/icons/alert.svg
    - asset/icons/detsils.svg
    - asset/icons/job-icon.svg
    - asset/icons/icon1.svg
    - asset/images/user-avatar.png
    - asset/images/avatar-circle.png
    - asset/images/image1.png
    - asset/images/image-cmpony.png
    - asset/images/image2.png
    - asset/images/image3.png
    - asset/images/profile_image.png
    - asset/images/profile-image2.png
    - asset/images/back-image.png
    - asset/images/office.png
    - asset/images/back-office.png
    - asset/images/user1.png
    - asset/images/user2.png
    - asset/images/user3.png
    - asset/images/user4.png

    # Development
    - assets/images/
    - assets/images/logo/
    - assets/images/footer_icons/
    - assets/images/rafiki.png

flutter_intl:
  enabled: true